<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企画リサーチ</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #151515;
      --panel: #222;
      --panel2: #2b2b2b;
      --text: #f2f2f2;
      --muted: #a8a8a8;
      --line: #3b3b3b;
      --accent: #38a169;
      --warn: #d69e2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(21, 21, 21, .96);
      border-bottom: 1px solid var(--line);
      padding: 14px 18px 12px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }
    .controls {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) repeat(4, max-content);
      gap: 10px;
      align-items: end;
    }
    label { color: var(--muted); font-size: 12px; display: grid; gap: 5px; }
    input, select, button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel2);
      color: var(--text);
      padding: 6px 9px;
      font: inherit;
    }
    button {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }
    .checks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 10px;
      color: var(--text);
    }
    .checks label {
      display: inline-flex;
      grid-template-columns: none;
      gap: 6px;
      align-items: center;
      font-size: 13px;
      color: var(--text);
    }
    .checks input { min-height: auto; }
    .status {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .channel-directory {
      margin-bottom: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .channel-directory summary {
      cursor: pointer;
      padding: 12px 14px;
      font-weight: 700;
      list-style-position: inside;
    }
    .channel-directory summary span {
      margin-left: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }
    .channel-directory-note {
      margin: 0;
      padding: 0 14px 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    .channel-table-wrap {
      overflow-x: auto;
      border-top: 1px solid var(--line);
    }
    .channel-table {
      width: 100%;
      min-width: 1320px;
      border-collapse: collapse;
      font-size: 12px;
    }
    .channel-table th,
    .channel-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    .channel-table th {
      color: var(--muted);
      background: #1b1b1b;
      position: sticky;
      top: 0;
    }
    .channel-table td.channel-note {
      white-space: normal;
      min-width: 180px;
      line-height: 1.45;
    }
    .channel-name {
      display: grid;
      gap: 2px;
      min-width: 180px;
    }
    .channel-name a { color: var(--text); text-decoration: none; font-weight: 700; }
    .channel-name small { color: var(--muted); }
    .data-pill {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 7px;
    }
    .data-pill.db { color: #9ae6b4; border-color: var(--accent); }
    .data-pill.saved { color: #fbd38d; border-color: var(--warn); }
    .data-pill.no { color: var(--muted); }
    .channel-filter {
      min-height: 28px;
      padding: 4px 8px;
      font-size: 11px;
    }
    .channel-filter:disabled {
      cursor: not-allowed;
      opacity: .45;
      background: var(--panel2);
      border-color: var(--line);
    }
    main { padding: 16px 18px 32px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      min-width: 0;
    }
    .card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background: #111;
    }
    .meta { padding: 8px; display: grid; gap: 5px; }
    .row { display: flex; gap: 8px; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .title {
      line-height: 1.45;
      min-height: 40px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .badges { display: flex; gap: 4px; flex-wrap: wrap; min-height: 20px; }
    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 7px;
      color: var(--muted);
      font-size: 11px;
    }
    .badge.hit { color: #fff; border-color: var(--accent); background: rgba(56,161,105,.18); }
    .badge.warn { color: #fff; border-color: var(--warn); background: rgba(214,158,46,.18); }
    dialog {
      width: min(980px, calc(100vw - 28px));
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0;
      background: var(--panel);
      color: var(--text);
    }
    dialog::backdrop { background: rgba(0, 0, 0, .78); }
    .detail {
      display: grid;
      grid-template-columns: minmax(280px, 48%) 1fr;
      gap: 14px;
      padding: 14px;
    }
    .detail img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; }
    .detail h2 { margin: 0 0 8px; font-size: 18px; line-height: 1.45; }
    .kv { color: var(--muted); font-size: 12px; display: grid; gap: 4px; }
    .block { margin-top: 12px; }
    .block h3 { margin: 0 0 5px; font-size: 13px; color: var(--muted); }
    .text {
      white-space: pre-wrap;
      max-height: 180px;
      overflow: auto;
      background: #1a1a1a;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 8px;
      line-height: 1.55;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .actions a, .actions button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
    }
    @media (max-width: 760px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .controls label:first-child { grid-column: 1 / -1; }
      .detail { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>企画リサーチ</h1>
    <div class="controls">
      <label>検索語
        <input id="q" type="search" placeholder="例: 双子 ボロボロ 食堂">
      </label>
      <label>チャンネル
        <select id="channel"></select>
      </label>
      <label>視聴回数
        <input id="minViews" type="number" min="0" step="10000" value="0">
      </label>
      <label>公開日以降
        <input id="dateFrom" type="date">
      </label>
      <label>並び替え
        <select id="sort">
          <option value="views_desc">視聴回数が多い順</option>
          <option value="likes_desc">高評価が多い順</option>
          <option value="comments_desc">コメントが多い順</option>
          <option value="like_rate_desc">高評価率が高い順</option>
          <option value="comment_rate_desc">コメント率が高い順</option>
          <option value="date_desc">公開日が新しい順</option>
          <option value="date_asc">公開日が古い順</option>
          <option value="relevance">関連度順</option>
        </select>
      </label>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="fieldThumbnail" checked> サムネ文字</label>
      <label><input type="checkbox" id="fieldTitle" checked> タイトル</label>
      <label><input type="checkbox" id="fieldTags" checked> タグ</label>
      <label><input type="checkbox" id="matchAll" checked> すべての語を含む</label>
      <label><input type="checkbox" id="missingThumbnailTextOnly"> サムネ文字未整備のみ</label>
      <button id="searchBtn" type="button">検索</button>
    </div>
    <div class="status" id="status"></div>
  </header>

  <main>
    <details class="channel-directory" open>
      <summary>基準チャンネル（提供33件中、公開対象32件）<span id="channelSummary"></span></summary>
      <p class="channel-directory-note">
        提供された33チャンネルのうち「俺たちの馴れ初め」は成人向け分類のため除外し、残る32チャンネルだけを検索対象にしています。
        台帳外の成人向け、漫画・ボイコミ参考、その他の旧競合も含めません。
        更新停止済みでも保存データがあるチャンネルは残し、データがないチャンネルも過去の競合記録として表示します。
      </p>
      <div class="channel-table-wrap">
        <table class="channel-table">
          <thead>
            <tr>
              <th>チャンネル</th>
              <th>分類</th>
              <th>データ</th>
              <th>更新状況</th>
              <th>バックアップ</th>
              <th>登録者</th>
              <th>DB動画</th>
              <th>検索動画</th>
              <th>再生数合計</th>
              <th>最終公開</th>
              <th>資産紐付け</th>
              <th>絞込</th>
              <th>備考</th>
            </tr>
          </thead>
          <tbody id="channelTable"></tbody>
        </table>
      </div>
    </details>
    <div class="grid" id="grid"></div>
  </main>

  <dialog id="dialog">
    <div class="detail">
      <div>
        <img id="detailImg" alt="">
        <div class="actions">
          <a id="youtubeLink" href="#" target="_blank" rel="noopener">YouTube</a>
          <button id="downloadCsvBtn" type="button">CSV DL</button>
          <button id="downloadThumbnailBtn" type="button">サムネDL</button>
          <button id="closeBtn" type="button">閉じる</button>
        </div>
      </div>
      <div>
        <h2 id="detailTitle"></h2>
        <div class="kv" id="detailMeta"></div>
        <div class="block">
          <h3>サムネ文字</h3>
          <div class="text" id="detailThumbnailText"></div>
        </div>
        <div class="block">
          <h3>冒頭ダイジェスト</h3>
          <div class="text" id="detailScriptText"></div>
        </div>
        <div class="block">
          <h3>サムネ分析</h3>
          <div class="text" id="detailThumbnailAnalysis"></div>
        </div>
        <div class="block">
          <h3>タグ</h3>
          <div class="badges" id="detailTags"></div>
        </div>
      </div>
    </div>
  </dialog>

  <script src="data/channels.js"></script>
  <script src="data/videos.js"></script>
  <script src="data/transcripts_light.js"></script>
  <script>
    const channels = window.CHANNEL_DATA || [];
    const videos = window.VIDEO_DATA || [];
    const transcriptById = new Map((window.TRANSCRIPT_DATA || []).map(t => [t.video_id, t]));
    const grid = document.getElementById("grid");
    const status = document.getElementById("status");
    const channelSelect = document.getElementById("channel");
    const channelTable = document.getElementById("channelTable");
    const fmt = new Intl.NumberFormat("ja-JP");
    const thumbnailPlaceholder = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#1a1a1a"/><text x="640" y="360" fill="#888" font-size="44" text-anchor="middle" dominant-baseline="middle">No thumbnail</text></svg>'
    );

    function init() {
      updateChannelOptions();
      renderChannelDirectory();
      document.getElementById("searchBtn").addEventListener("click", render);
      document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") render(); });
      const dialog = document.getElementById("dialog");
      document.getElementById("closeBtn").addEventListener("click", () => dialog.close());
      dialog.addEventListener("click", e => {
        const rect = dialog.getBoundingClientRect();
        const isBackdropClick =
          e.clientX < rect.left ||
          e.clientX > rect.right ||
          e.clientY < rect.top ||
          e.clientY > rect.bottom;
        if (isBackdropClick) dialog.close();
      });
      render();
    }

    function renderChannelDirectory() {
      const dbData = channels.filter(channel => channel.data_status === "DBデータあり").length;
      const savedData = channels.filter(channel => channel.data_status === "保存データあり").length;
      const noData = channels.filter(channel => channel.data_status === "データなし").length;
      document.getElementById("channelSummary").textContent =
        `${fmt.format(channels.length)}件 / DBデータあり ${fmt.format(dbData)} / 保存データあり ${fmt.format(savedData)} / データなし ${fmt.format(noData)}`;

      channelTable.innerHTML = channels.map(channel => {
        const hasPortalVideos = Number(channel.portal_video_count || 0) > 0;
        const dataClass = channel.data_status === "DBデータあり"
          ? "db"
          : channel.data_status === "保存データあり"
          ? "saved"
          : "no";
        const viewSum = Number(channel.portal_view_sum || channel.db_sum_video_views || 0);
        const latest = String(channel.latest_public_video || channel.latest_video || channel.portal_latest_video || "").slice(0, 10) || "—";
        return `<tr>
          <td><span class="channel-name"><a href="${escapeAttr(channel.youtube_url)}" target="_blank" rel="noopener">${escapeHtml(channel.channel_name)}</a><small>${escapeHtml(channel.handle || "")}</small></span></td>
          <td>${escapeHtml(channel.category_label || "")}</td>
          <td><span class="data-pill ${dataClass}">${escapeHtml(channel.data_status || "")}</span></td>
          <td>${escapeHtml(channel.lifecycle || "")}</td>
          <td>${escapeHtml(channel.backup_status || "")}</td>
          <td>${fmt.format(Number(channel.subscriber_count || 0))}</td>
          <td>${fmt.format(Number(channel.db_video_rows || 0))}</td>
          <td>${fmt.format(Number(channel.portal_video_count || 0))}</td>
          <td>${viewSum ? fmt.format(viewSum) : "—"}</td>
          <td>${escapeHtml(latest)}</td>
          <td>${escapeHtml(channel.asset_status || "")}</td>
          <td><button class="channel-filter" type="button" data-channel-name="${escapeAttr(channel.portal_channel_name || channel.channel_name || "")}" ${hasPortalVideos ? "" : "disabled"}>${hasPortalVideos ? `表示 ${fmt.format(Number(channel.portal_video_count || 0))}本` : "表示データなし"}</button></td>
          <td class="channel-note">${escapeHtml(channel.note || "")}</td>
        </tr>`;
      }).join("");

      channelTable.querySelectorAll(".channel-filter:not(:disabled)").forEach(button => {
        button.addEventListener("click", () => {
          channelSelect.value = button.dataset.channelName || "";
          render();
          document.querySelector("header").scrollIntoView({ behavior: "smooth" });
        });
      });
    }

    function render() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const terms = q.split(/\s+/).filter(Boolean);
      const fields = selectedFields();
      const matchAll = document.getElementById("matchAll").checked;
      const channel = channelSelect.value;
      const minViews = Number(document.getElementById("minViews").value || 0);
      const dateFrom = document.getElementById("dateFrom").value;
      const sort = document.getElementById("sort").value;
      const missingThumbnailTextOnly = document.getElementById("missingThumbnailTextOnly").checked;
      let rows = videos.map(v => {
        const hit = hitInfo(v, terms, fields, matchAll);
        return { v, hit };
      }).filter(({ v, hit }) => {
        if (channel && v.channel !== channel) return false;
        if (observedViews(v) < minViews) return false;
        if (dateFrom && (!v.published_at || v.published_at.slice(0, 10) < dateFrom)) return false;
        if (missingThumbnailTextOnly && (v.thumbnail_text || "").trim()) return false;
        if (terms.length && !hit.ok) return false;
        return true;
      });

      if (sort === "views_desc") rows.sort((a, b) => observedViews(b.v) - observedViews(a.v));
      if (sort === "likes_desc") rows.sort((a, b) => observedLikes(b.v) - observedLikes(a.v));
      if (sort === "comments_desc") rows.sort((a, b) => observedComments(b.v) - observedComments(a.v));
      if (sort === "like_rate_desc") rows.sort((a, b) => rateValue(observedLikes(b.v), observedViews(b.v)) - rateValue(observedLikes(a.v), observedViews(a.v)));
      if (sort === "comment_rate_desc") rows.sort((a, b) => rateValue(observedComments(b.v), observedViews(b.v)) - rateValue(observedComments(a.v), observedViews(a.v)));
      if (sort === "date_desc") rows.sort((a, b) => String(b.v.published_at).localeCompare(String(a.v.published_at)));
      if (sort === "date_asc") rows.sort((a, b) => String(a.v.published_at).localeCompare(String(b.v.published_at)));
      if (sort === "relevance") rows.sort((a, b) => b.hit.score - a.hit.score || observedViews(b.v) - observedViews(a.v));

      const limited = rows.slice(0, 500);
      status.textContent = `表示 ${fmt.format(limited.length)}件 / ヒット ${fmt.format(rows.length)}件 / 32ch対象動画 ${fmt.format(videos.length)}件`;
      grid.innerHTML = limited.map(({ v, hit }) => cardHtml(v, hit)).join("");
      grid.querySelectorAll(".card").forEach(el => {
        el.addEventListener("click", () => openDetail(videos[Number(el.dataset.idx)]));
      });
    }

    function updateChannelOptions() {
      const selected = channelSelect.value;
      const counts = new Map();
      videos.forEach(v => counts.set(v.channel, (counts.get(v.channel) || 0) + 1));
      const channels = [...counts.keys()].filter(Boolean).sort((a, b) => a.localeCompare(b, "ja"));
      channelSelect.innerHTML = '<option value="">すべて</option>' + channels.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)} (${counts.get(c)})</option>`).join("");
      if (counts.has(selected)) channelSelect.value = selected;
    }

    function selectedFields() {
      return {
        thumbnail: document.getElementById("fieldThumbnail").checked,
        title: document.getElementById("fieldTitle").checked,
        tags: document.getElementById("fieldTags").checked,
      };
    }

    function hitInfo(v, terms, fields, matchAll) {
      if (!terms.length) return { ok: true, score: 0, fields: [] };
      const texts = [];
      if (fields.thumbnail) texts.push(["サムネ文字", v.thumbnail_text || ""]);
      if (fields.title) texts.push(["タイトル", v.title || ""]);
      if (fields.tags) texts.push(["タグ", (v.tags || []).join(" ")]);
      const termHits = terms.map(term => {
        const hitFields = texts.filter(([, text]) => String(text).toLowerCase().includes(term)).map(([name]) => name);
        return hitFields;
      });
      const ok = matchAll ? termHits.every(x => x.length) : termHits.some(x => x.length);
      const fieldsHit = [...new Set(termHits.flat())];
      return { ok, score: fieldsHit.length + termHits.filter(x => x.length).length, fields: fieldsHit };
    }

    function cardHtml(v, hit) {
      const idx = videos.indexOf(v);
      const date = (v.published_at || "").slice(0, 10) || "日付なし";
      const badges = hit.fields.length
        ? hit.fields.map(x => `<span class="badge hit">${escapeHtml(x)}</span>`).join("")
        : (v.thumbnail_text ? "" : '<span class="badge warn">サムネ文字未整備</span>');
      const sourceBadge = v.is_archive ? '<span class="badge">アーカイブ</span>' : "";
      const scopeBadges = (v.content_flags || []).map(flag => `<span class="badge warn">${escapeHtml(flagLabel(flag))}</span>`).join("");
      return `<article class="card" data-idx="${idx}">
        <img src="${escapeAttr(preferredThumbnail(v))}" alt="" loading="lazy" data-fallback-index="0" onerror="fallbackImage(this, ${idx})">
        <div class="meta">
          <div class="row"><span>${escapeHtml(v.channel || "")}</span><span>${fmt.format(v.view_count || 0)} 回</span></div>
          <div class="title">${escapeHtml(v.title || "")}</div>
          <div class="row"><span>高評価 ${fmt.format(v.like_count || 0)} / ${rateText(v.like_count, v.view_count)}</span><span>コメント ${fmt.format(v.comment_count || 0)} / ${rateText(v.comment_count, v.view_count)}</span></div>
          <div class="row"><span>${date}</span><span>${escapeHtml(v.video_id)}</span></div>
          <div class="badges">${sourceBadge}${scopeBadges}${badges}</div>
        </div>
      </article>`;
    }

    function openDetail(v) {
      const t = transcriptById.get(v.video_id);
      const detailImg = document.getElementById("detailImg");
      detailImg.dataset.idx = videos.indexOf(v);
      applyThumbnail(detailImg, v);
      document.getElementById("detailTitle").textContent = v.title || "";
      document.getElementById("youtubeLink").href = v.youtube_url;
      document.getElementById("detailMeta").innerHTML = [
        `チャンネル: ${escapeHtml(v.channel || "")}`,
        `視聴回数: ${fmt.format(v.view_count || 0)} 回`,
        `高評価: ${fmt.format(v.like_count || 0)} / 高評価率 ${rateText(v.like_count, v.view_count)}`,
        `コメント: ${fmt.format(v.comment_count || 0)} / コメント率 ${rateText(v.comment_count, v.view_count)}`,
        `公開日: ${escapeHtml((v.published_at || "").slice(0, 10) || "日付なし")}`,
        `更新日: ${escapeHtml(formatDateTime(v.fetched_at) || "不明")}`,
        `source: ${escapeHtml(v.source_type || "current")}`,
        `YouTube状態: ${escapeHtml(v.youtube_availability || "未確認")} ${escapeHtml(formatDateTime(v.availability_checked_at) || "")}`,
        `区分: ${escapeHtml(v.scope_type || "")}`,
        `表示フラグ: ${escapeHtml((v.content_flags || []).map(flagLabel).join("、") || "なし")}`,
        `video_id: ${escapeHtml(v.video_id)}`
      ].map(x => `<div>${x}</div>`).join("");
      document.getElementById("detailThumbnailText").textContent = v.thumbnail_text || "未整備";
      document.getElementById("detailScriptText").textContent = t ? t.digest + (t.chars > t.digest.length ? `\n\n... (${fmt.format(t.chars)}文字中、冒頭${fmt.format(t.digest.length)}文字)` : "") : "未取得";
      document.getElementById("detailThumbnailAnalysis").textContent = formatThumbnailAnalysis(v.thumbnail_analysis);
      document.getElementById("detailTags").innerHTML = (v.tags || []).slice(0, 80).map(x => `<span class="badge">${escapeHtml(x)}</span>`).join("");
      document.getElementById("downloadCsvBtn").onclick = () => downloadCsv(v, t);
      document.getElementById("downloadThumbnailBtn").onclick = () => downloadThumbnail(v);
      document.getElementById("dialog").showModal();
    }

    function downloadCsv(v, t) {
      if (v.script_csv_url) {
        const a = document.createElement("a");
        a.href = v.script_csv_url;
        a.download = `${downloadBaseName(v)}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        return;
      }
      const row = [v.video_id, v.channel || "", v.title || "", v.youtube_url, preferredThumbnail(v), v.published_at || "", v.fetched_at || "", v.view_count || 0, v.like_count || 0, v.comment_count || 0, rateText(v.like_count, v.view_count), rateText(v.comment_count, v.view_count), t ? t.digest : ""];
      const csv = ["video_id,channel,title,youtube_url,thumbnail_url,published_at,fetched_at,view_count,like_count,comment_count,like_rate,comment_rate,digest", row.map(csvCell).join(",")].join("\n");
      downloadBlob(`${downloadBaseName(v)}.csv`, csv, "text/csv;charset=utf-8");
    }

    function observedViews(v) {
      return Number(v.max_observed_view_count || v.observed_view_count || v.view_count || 0);
    }

    function observedLikes(v) {
      return Number(v.observed_like_count || v.like_count || 0);
    }

    function observedComments(v) {
      return Number(v.observed_comment_count || v.comment_count || 0);
    }

    function rateValue(count, views) {
      return views ? (Number(count || 0) / Number(views || 0)) : 0;
    }

    function rateText(count, views) {
      return `${(rateValue(count, views) * 100).toFixed(2)}%`;
    }

    async function downloadThumbnail(v) {
      const urls = thumbnailCandidates(v);
      for (const url of urls) {
        try {
          const res = await fetch(url, { mode: "cors" });
          if (!res.ok) continue;
          const blob = await res.blob();
          const ext = blob.type.includes("png") ? "png" : "jpg";
          downloadBlob(`${downloadBaseName(v)}_thumbnail.${ext}`, blob, blob.type || "image/jpeg");
          return;
        } catch (e) {
          // Try the next candidate.
        }
      }
      if (urls.length) window.open(urls[urls.length - 1], "_blank", "noopener");
    }

    function preferredThumbnail(v) {
      return thumbnailCandidates(v)[0] || thumbnailPlaceholder;
    }

    function thumbnailCandidates(v) {
      return [...new Set([
        v && v.thumbnail_saved_url,
        v && v.thumbnail_max_url,
        ...(v && v.thumbnail_fallback_urls ? v.thumbnail_fallback_urls : []),
        v && v.thumbnail_url,
      ].filter(Boolean))];
    }

    function applyThumbnail(img, v) {
      const urls = thumbnailCandidates(v);
      img.dataset.fallbackIndex = "0";
      img.onerror = () => fallbackImageForVideo(img, v);
      img.src = urls[0] || thumbnailPlaceholder;
    }

    function fallbackImage(img, idx) {
      const v = videos[idx];
      fallbackImageForVideo(img, v);
    }

    function fallbackImageForVideo(img, v) {
      const urls = thumbnailCandidates(v);
      const nextIndex = Number(img.dataset.fallbackIndex || 0) + 1;
      if (nextIndex < urls.length) {
        img.dataset.fallbackIndex = String(nextIndex);
        img.src = urls[nextIndex];
        return;
      }
      img.onerror = null;
      img.src = thumbnailPlaceholder;
    }

    function downloadBlob(filename, body, type) {
      const blob = body instanceof Blob ? body : new Blob([body], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function csvCell(value) {
      return `"${String(value).replace(/"/g, '""')}"`;
    }

    function formatDateTime(value) {
      if (!value) return "";
      return String(value).replace("T", " ").replace("Z", "").slice(0, 19);
    }

    function formatThumbnailAnalysis(a) {
      if (!a) return "未整備";
      const rows = [
        ["主役", a.main_subject],
        ["人物", a.people],
        ["舞台", a.setting],
        ["構図", a.composition],
        ["感情訴求", a.emotion_appeal],
        ["フック", a.story_hook],
      ].filter(([, value]) => value);
      return rows.length ? rows.map(([k, v]) => `${k}: ${v}`).join("\n") : "未整備";
    }

    function flagLabel(flag) {
      return ({
        adult: "成人向け",
        manga_reference: "漫画・元ネタ",
        out_of_scope: "その他参考元",
      })[flag] || flag;
    }

    function downloadBaseName(v) {
      const title = sanitizeFilename(v.title || "").slice(0, 20) || "untitled";
      return `${v.video_id}_${title}`;
    }

    function sanitizeFilename(value) {
      return String(value)
        .replace(/[\\/:*?"<>|\r\n]/g, "")
        .replace(/\s+/g, "")
        .trim();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function escapeAttr(value) { return escapeHtml(value); }

    init();
  </script>
</body>
</html>
